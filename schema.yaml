description: >
  A weather source that takes current readings from MQTT topics and
  everything else — icons, pressure, hourly and daily forecast — from
  the weather-provider it wraps.  Each topic names the unit its payload
  is already in; values are converted to Celsius, percent, km/h and
  degrees before widgets see them.

provides: [conditions, hourly, daily]

settings:

  weather-provider:
    is: provider
    provides: [conditions, hourly, daily]
    required: true
    help: >
      The existing weather instance (openmeteo, metar, …) that still
      supplies anything MQTT does not publish.

  mqtt-host:
    is: string
    help: Broker hostname or IP.
  mqtt-port:
    is: number
    range: [1, 65535]
    help: Broker port.  1883 plain, 8883 typically TLS.
  mqtt-username:
    is: string
    help: Broker username.  Leave blank for anonymous.
  mqtt-password:
    is: string
    help: Broker password.
  mqtt-client-id:
    is: string
    help: MQTT client id.  Change it if two clocks share a broker.
  tls:
    is: boolean
    help: Use TLS against the broker.

  mqtt-topics:
    is: table
    of: mqtt-reading
    help: >
      One entry per reading to replace.  Keys are conditions fields:
      temp, humidity, wind, wind-dir, gust, feels-like, dew, pressure.
      A string is accepted as a bare topic.

  # the original two-topic form; still accepted, ignored when mqtt-topics
  # already names that field
  mqtt-temp-topic:
    is: string
    help: Topic that publishes the temperature.  Prefer mqtt-topics.temp.
  mqtt-humidity-topic:
    is: string
    help: Topic that publishes humidity.  Prefer mqtt-topics.humidity.
  mqtt-temp-unit:
    is: string
    help: Unit of mqtt-temp-topic — C, F or K.  Prefer a unit on the topic.
  payload-key:
    is: string
    help: Dotted JSON path used when a topic does not name its own.
  humidity-payload-key:
    is: string
    help: Dotted JSON path for mqtt-humidity-topic.

types:

  mqtt-reading:
    is: block
    help: One MQTT topic and the unit its payload is already in.
    of:
      topic:
        is: string
        required: true
        help: Topic that publishes this reading.  Home Assistant state topics are a bare number.
      unit:
        is: string
        help: >
          Payload unit.  Temperature: C, F, K.  Speed: mph, kph, mps, kt.
          Direction: deg.  Pressure: hPa, mb, inHg.  Blank means the
          reading is already in the unit the widgets expect.
      payload-key:
        is: string
        help: >
          Dotted path into a JSON payload, e.g. state or current.temp.
          Blank accepts a bare number.